{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>The Cafe | Form Pemesanan</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'bootstrap/css/style.css' %}">
</head>

<body style="background-color:#2b1d14; color:white;">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top"
     style="background-color:#1f140d;">
  <div class="container">
    <a class="navbar-brand fw-bold text-warning" href="/">The Cafe</a>

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-center" id="nav">
      <ul class="navbar-nav gap-3">
        <li class="nav-item"><a class="nav-link text-light" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link text-light" href="/menu/">Menu</a></li>
        <li class="nav-item">
          <a class="nav-link text-warning fw-semibold active" href="/pesan/">
            Pesan
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- FORM PEMESANAN -->
<section class="container py-5" style="margin-top:100px;">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">

      <div class="card p-4"
           style="background-color:#1f140d; border-radius:16px;">

        <h3 class="text-center text-warning fw-bold mb-2">
          Form Pemesanan
        </h3>
        <p class="text-center opacity-75 mb-4">
          Silakan isi data pemesanan Anda
        </p>

        <form method="post" action="{% url 'berhasil' %}">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label">Nama Pemesan</label>
            <input type="text"
                   class="form-control form-control-sm"
                   placeholder="Masukkan nama Anda"
                   required>
          </div>

          <div class="mb-3">
            <label class="form-label">Pilih Menu</label>
            <select class="form-select form-select-sm" required>
              <option value="">-- Pilih Menu --</option>
              <option>Nasi Goreng Spesial</option>
              <option>Mie Goreng</option>
              <option>Chicken Katsu</option>
              <option>Spaghetti Bolognese</option>
              <option>Kentang Goreng Keju</option>
              <option>Ayam Geprek Sambal Matah</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Jumlah</label>
            <input type="number"
                   class="form-control form-control-sm"
                   min="1"
                   value="1"
                   required>
          </div>

          <div class="mb-3">
            <label class="form-label">Catatan (Opsional)</label>
            <textarea class="form-control form-control-sm" rows="3"></textarea>
          </div>

          <div class="d-grid mt-4">
            <button type="submit"
                    class="btn btn-warning fw-semibold rounded-pill">
              Pesan Sekarang
            </button>
          </div>

        </form>

      </div>

    </div>
  </div>
</section>

<!-- Bootstrap JS -->
<script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>

</body>
</html>
